name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: API (Spring Boot / JDK 25)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mybarber_test
          TZ: America/Sao_Paulo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar e testar (unitarios + integracao com MySQL)
        run: mvn -B -ntp verify -Dtestes.excluir=nenhum
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: mybarber_test
      - name: Relatorio de testes
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do echo "== $f"; cat "$f"; done
          tail -n 200 target/surefire-reports/*-output.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mybarber-api
          path: backend/target/mybarber-api.jar

