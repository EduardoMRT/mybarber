name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: API (Spring Boot / JDK 25)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mybarber_test
          TZ: America/Sao_Paulo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar e testar (unitarios + integracao com MySQL)
        run: mvn -B -ntp verify -Dtestes.excluir=nenhum
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: mybarber_test
      - name: Resumo dos testes
        if: always()
        run: |
          python3 - <<'PYX'
          import glob, xml.etree.ElementTree as ET
          total = falhas = 0
          for f in glob.glob('target/surefire-reports/TEST-*.xml'):
              r = ET.parse(f).getroot()
              total += int(r.get('tests', 0))
              for tc in r.iter('testcase'):
                  for tag in ('failure', 'error'):
                      e = tc.find(tag)
                      if e is not None:
                          falhas += 1
                          msg = (e.get('message') or e.text or '')[:900].replace('%', '%25').replace('\n', '%0A').replace('\r', '')
                          print(f"::error title={tc.get('classname')}.{tc.get('name')}::{msg}")
              print(f"::notice title={r.get('name')}::{r.get('tests')} testes, {r.get('failures')} falhas, {r.get('errors')} erros, {r.get('skipped')} ignorados")
          print(f"::notice title=Total de testes::{total} testes, {falhas} com problema")
          PYX
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mybarber-api
          path: backend/target/mybarber-api.jar


  admin:
    name: Portal (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
