# Configuracao do MyBarber API.
# Valores sensiveis vem de variaveis de ambiente ou do arquivo backend/.env (fora do git).
spring:
  application:
    name: mybarber-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mybarber}?useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USER:mybarber}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

mybarber:
  zona: America/Sao_Paulo
  jwt:
    # minimo 32 caracteres; gere com: openssl rand -base64 48
    segredo: ${JWT_SECRET:}
    minutos-acesso: ${JWT_MINUTOS:60}
    dias-refresh: ${JWT_DIAS_REFRESH:30}
  admin:
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_PASSWORD:}
    nome: ${ADMIN_NOME:Administrador MyBarber}
  cors:
    origens: ${CORS_ORIGINS:http://localhost:5173}
  legal:
    versao: "1.0"
